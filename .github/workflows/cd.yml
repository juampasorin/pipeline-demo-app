name: CD

on:
  push:
    branches: [main]
  # Allows triggering the AWS deploy job manually, on demand, rather than
  # automatically on every push — deliberate gate for anything that touches
  # real infrastructure.
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to GitHub Container Registry
  id-token: write   # needed for OIDC (AWS) authentication

jobs:
  # --- Always runs on push to main: build the image and publish it to GHCR ---
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry

      - name: Set up Docker Buildx uses: docker/setup-buildx-action@v3
      
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Manual-only: deploy to AWS using short-lived OIDC credentials ---
  # This job is intentionally NOT wired to run automatically on every push.
  # To use it for real: create an AWS IAM role trusting GitHub's OIDC
  # provider, scoped to this exact repo/branch, and set AWS_ROLE_ARN as a
  # repository variable.
  deploy-to-aws:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # supports required reviewers / approval gates
    steps:
      - uses: actions/checkout@v4

      # No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY anywhere — this
      # exchanges GitHub's short-lived OIDC token for temporary AWS
      # credentials, scoped to this one job run.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} \
            ${{ steps.ecr-login.outputs.registry }}/pipeline-demo-app:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/pipeline-demo-app:${{ github.sha }}

      - name: Deploy to ECS (rolling update)
        run: |
          aws ecs update-service \
            --cluster production-cluster \
            --service pipeline-demo-app \
            --force-new-deployment
